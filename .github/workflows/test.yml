# Auto-generated by ma-provider-tools — do not edit manually.
name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Clone MA server fork
        run: git clone --depth=1 -b dev https://github.com/trudenboy/ma-server.git ma-server

      - name: Symlink provider
        run: |
          rm -rf ma-server/music_assistant/providers/dlna_receiver
          ln -s "$GITHUB_WORKSPACE/provider" ma-server/music_assistant/providers/dlna_receiver

      - name: Install dependencies
        run: |
          cd ma-server
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[test]"
          uv pip install -r requirements_all.txt
          cd "$GITHUB_WORKSPACE"
          uv pip install -e ".[test]"

      - name: Ruff check
        run: |
          source ma-server/.venv/bin/activate
          ruff check provider/

      - name: Ruff format check
        run: |
          source ma-server/.venv/bin/activate
          ruff format --check provider/

      - name: Mypy
        run: |
          source ma-server/.venv/bin/activate
          cd ma-server
          mypy --ignore-missing-imports music_assistant/providers/dlna_receiver/
        continue-on-error: true

      - name: Pytest
        run: |
          source ma-server/.venv/bin/activate
          cd "$GITHUB_WORKSPACE"
          pytest tests/ -v
        continue-on-error: true
